name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: >
          composer update
          --prefer-stable
          --no-interaction
          --no-progress
          --ignore-platform-req=ext-vulkan
          --ignore-platform-req=ext-glfw

      - name: Execute tests
        run: vendor/bin/pest
